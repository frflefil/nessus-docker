version: '3.8'

services:
  openvas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openvas
    image: usuario/openvas:2.0
    ports:
      - "8080:8080"
    volumes:
      # Persistencia de configuración
      - ./host_dirs/config:/etc/scanner
      # Persistencia de datos/base de datos
      - ./host_dirs/plugins:/var/lib/scanner
      # Persistencia de logs
      - ./host_dirs/logs:/var/log/scanner
    environment:
      # Scanner variables
      - SCANNER_USERNAME=admin
      - SCANNER_PASSWORD=changeme123
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - openvas-net

networks:
  openvas-net:
    driver: bridge
